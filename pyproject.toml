[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "access-it"
version = "0.1.0"
description = "Personal project aimed at predicting the results of amateur-level French cycling races (Access category)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yoann Robert", email = "yoann.robert44@gmail.com" }]

# Lower bound: version tested; upper bound: next major version (pyarrow, whose
# major versions are frequent and keep the Parquet API, has no upper bound)
dependencies = [
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.15,<5",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
    "pandas>=3.0,<4",
    "pyarrow>=25.0",
    "python-dotenv>=1.2,<2",
    "boto3>=1.43,<2",
]

[project.optional-dependencies]
# ruff: upper bound on the minor version, since its 0.x minor releases may change the rules
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "jupyter", "boto3-stubs[s3]>=1.43,<2"]
api = ["fastapi", "uvicorn"]
dashboard = ["streamlit>=1.66,<2", "altair>=6.3,<7"]
ml = ["scikit-learn", "xgboost", "mlflow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["regression: slow non-regression test of the full transform step"]
