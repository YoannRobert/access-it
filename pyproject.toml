[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "access-it"
version = "0.1.0"
description = "Personal project aimed at predicting the results of amateur-level French cycling races (Access category)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yoann Robert", email = "yoann.robert44@gmail.com" }]

# Lower bound: version tested; upper bound: next major version (pyarrow, whose
# major versions are frequent and keep the Parquet API, has no upper bound)
dependencies = [
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.15,<5",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
    "pandas>=3.0,<4",
    "pyarrow>=25.0",
    "python-dotenv>=1.2,<2",
    "boto3>=1.43,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff", "jupyter", "boto3-stubs[s3]>=1.43,<2"]
app = ["streamlit", "fastapi", "uvicorn", "plotly"]
ml = ["scikit-learn", "xgboost", "mlflow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["regression: slow non-regression test of the full transform step"]
